services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://evolution:evolution_dev_only@postgres:5432/evolution
    ports:
      - "8000:8000"
    depends_on:
      - postgres
volumes:
  postgres_data:
